<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Cotizaciones - Nonna</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#5d1927", "brand-pink": "#FEBDC6", "background-light": "#f8f6f6", "background-dark": "#1f1316" },
                    fontFamily: { "display": ["Montserrat", "sans-serif"] },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body { background-color: #FEBDC6; font-family: 'Montserrat', sans-serif; }
        .toast-notification {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            min-width: 280px; background: white; border-radius: 0.75rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            padding: 1rem; display: flex; align-items: center; gap: 0.75rem;
            transform: translateX(400px); transition: transform 0.3s ease-out;
            border-left: 4px solid;
        }
        .toast-notification.show { transform: translateX(0); }
        .toast-notification.success { border-left-color: #10b981; }
        .toast-notification.error { border-left-color: #ef4444; }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #5d1927;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn-disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-7xl mx-auto">
        <!-- Header con botón regreso -->
        <div class="flex justify-between items-center mb-6">
            <a href="index.html" class="flex items-center gap-2 text-primary font-semibold hover:opacity-80">
                <span class="material-symbols-outlined">arrow_back</span>
                <span>CRUD's del Sistema</span>
            </a>
            <div class="flex items-center gap-3 text-primary">
                <div class="bg-primary p-2 rounded-lg text-white">
                    <span class="material-symbols-outlined">receipt_long</span>
                </div>
                <span class="text-2xl font-bold">Nonna</span>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="p-6 border-b border-primary/10 flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-extrabold text-primary">Cotizaciones</h1>
                    <p class="text-slate-500">Gestión de ítems cotizados por pedido</p>
                </div>
                <a href="cotizacion_nuevo.html" class="bg-primary text-white px-5 py-2.5 rounded-lg font-bold flex items-center gap-2 hover:bg-primary/90 transition-all">
                    <span class="material-symbols-outlined">add_circle</span>
                    Nueva Cotización
                </a>
            </div>
            <div class="p-6 overflow-x-auto">
                <div class="mb-4 flex justify-between items-center">
                    <div class="flex gap-2">
                        <button id="btn-refresh" class="px-4 py-2 bg-primary/10 text-primary rounded-lg font-semibold hover:bg-primary/20 transition-all flex items-center gap-2">
                            <span class="material-symbols-outlined">refresh</span>
                            Actualizar
                        </button>
                    </div>
                    <div id="info-cantidad" class="text-sm text-slate-500"></div>
                </div>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-primary/80 text-sm font-bold border-b border-primary/10">
                            <th class="pb-3">ID Cotización</th>
                            <th class="pb-3">ID Pedido</th>
                            <th class="pb-3">ID Producto</th>
                            <th class="pb-3">Producto</th>
                            <th class="pb-3">Cantidad</th>
                            <th class="pb-3">Precio Unitario</th>
                            <th class="pb-3">Diseño</th>
                            <th class="pb-3">Envío</th>
                            <th class="pb-3">Subtotal</th>
                            <th class="pb-3 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cotizaciones" class="divide-y divide-primary/5">
                        <tr><td colspan="10" class="text-center py-8"><div class="loading-spinner"></div><p class="text-slate-400 mt-2">Cargando cotizaciones...</p></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://3.15.13.161:8000/api';
        const TOKEN = localStorage.token;
        if (!TOKEN) {
            alert('No hay sesión activa.');
            window.location.href = 'index.html';
        }

        function getHeaders() {
            return { 'accept': 'application/json', 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };
        }

        // Toast simple
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container') || (() => {
                const div = document.createElement('div');
                div.id = 'toast-container';
                div.style.cssText = 'position:fixed; top:20px; right:20px; z-index:1000; display:flex; flex-direction:column; gap:10px;';
                document.body.appendChild(div);
                return div;
            })();
            const toast = document.createElement('div');
            toast.className = `toast-notification ${type}`;
            const icon = type === 'success' ? 'check_circle' : 'error';
            const color = type === 'success' ? '#10b981' : '#ef4444';
            toast.innerHTML = `<div><span class="material-symbols-outlined" style="color:${color}">${icon}</span></div><div class="flex-1">${msg}</div><div class="toast-close cursor-pointer"><span class="material-symbols-outlined">close</span></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            toast.querySelector('.toast-close').onclick = () => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            };
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        let productosMap = {};
        let preciosProductosMap = {};
        let isLoading = false; // Controlar carga simultánea

        async function cargarProductos() {
            try {
                const res = await fetch(`${API_BASE}/producto/`, { headers: getHeaders() });
                if (res.ok) {
                    const productos = await res.json();
                    productos.forEach(p => {
                        productosMap[p.id_producto] = p.descripcion || `Producto ${p.id_producto}`;
                        preciosProductosMap[p.id_producto] = parseFloat(p.precio_unitario) || 0;
                    });
                    console.log('Productos cargados:', Object.keys(productosMap).length);
                } else {
                    console.error('Error cargando productos:', res.status);
                }
            } catch(e) { console.error('Error en cargarProductos:', e); }
        }

        async function listarCotizaciones() {
            console.log('Obteniendo cotizaciones desde:', `${API_BASE}/cotizacion/`);
            const res = await fetch(`${API_BASE}/cotizacion/`, { headers: getHeaders() });
            if (!res.ok) {
                const errorText = await res.text();
                console.error('Error respuesta API:', res.status, errorText);
                throw new Error(`Error ${res.status}: ${errorText}`);
            }
            const data = await res.json();
            console.log('Cotizaciones recibidas:', data);
            return data;
        }

        function calcularSubtotal(cotizacion) {
            const precioUnitario = preciosProductosMap[cotizacion.id_producto] || 0;
            const cantidad = parseFloat(cotizacion.cantidad) || 0;
            const diseño = parseFloat(cotizacion.precio_disenio) || 0;
            const envio = parseFloat(cotizacion.precio_envio) || 0;
            const subtotal = (cantidad * precioUnitario) + diseño + envio;
            return subtotal;
        }

        async function cargarYRenderizar() {
            // Evitar múltiples cargas simultáneas
            if (isLoading) {
                console.log('Ya hay una carga en proceso, omitiendo...');
                return;
            }
            
            isLoading = true;
            const tbody = document.getElementById('tabla-cotizaciones');
            const infoCantidad = document.getElementById('info-cantidad');
            const refreshBtn = document.getElementById('btn-refresh');
            
            // Deshabilitar botón de refresh durante la carga
            if (refreshBtn) {
                refreshBtn.classList.add('btn-disabled');
                refreshBtn.disabled = true;
            }
            
            tbody.innerHTML = '<tr><td colspan="10" class="text-center py-8"><div class="loading-spinner"></div><p class="text-slate-400 mt-2">Cargando cotizaciones...</p></td></td>';
            
            try {
                await cargarProductos();
                const cotizaciones = await listarCotizaciones();
                
                if (!cotizaciones || cotizaciones.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" class="text-center py-8 text-slate-400">📋 No hay cotizaciones registradas. Crea la primera usando el botón "Nueva Cotización".</td></tr>';
                    infoCantidad.textContent = '0 cotizaciones';
                    return;
                }
                
                infoCantidad.textContent = `${cotizaciones.length} cotizaciones encontradas`;
                tbody.innerHTML = '';
                
                cotizaciones.forEach((c) => {
                    const producto = productosMap[c.id_producto] || `Producto ${c.id_producto}`;
                    const precioUnitario = preciosProductosMap[c.id_producto] || 0;
                    const subtotal = calcularSubtotal(c);
                    
                    const fila = `
                        <tr class="hover:bg-primary/5 transition-colors" data-cotizacion-id="${c.id_cotizacion}">
                            <td class="py-3 font-mono text-sm">${c.id_cotizacion || 'N/A'}</td>
                            <td class="py-3">${c.id_pedido}</td>
                            <td class="py-3 font-mono text-sm">${c.id_producto}</td>
                            <td class="py-3 font-medium">${escapeHtml(producto)}</td>
                            <td class="py-3 text-center">${c.cantidad}</td>
                            <td class="py-3 text-right">$${precioUnitario.toFixed(2)}</td>
                            <td class="py-3 text-right">$${parseFloat(c.precio_disenio || 0).toFixed(2)}</td>
                            <td class="py-3 text-right">$${parseFloat(c.precio_envio || 0).toFixed(2)}</td>
                            <td class="py-3 text-right font-bold text-primary text-lg">$${subtotal.toFixed(2)}</td>
                            <td class="py-3 text-right">
                                <div class="flex justify-end gap-2">
                                    <button onclick="editarCotizacion(${c.id_cotizacion}, ${c.id_pedido}, ${c.id_producto})" class="text-primary hover:bg-primary/10 p-1 rounded transition-colors" title="Editar">
                                        <span class="material-symbols-outlined">edit</span>
                                    </button>
                                    <button onclick="eliminarCotizacion(${c.id_cotizacion})" class="btn-eliminar text-red-600 hover:bg-red-50 p-1 rounded transition-colors" title="Eliminar" data-id="${c.id_cotizacion}">
                                        <span class="material-symbols-outlined">delete</span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', fila);
                });
                
                showToast(`Se cargaron ${cotizaciones.length} cotizaciones correctamente`, 'success');
            } catch (error) {
                console.error('Error en cargarYRenderizar:', error);
                tbody.innerHTML = `<tr><td colspan="10" class="text-center py-8 text-red-500">❌ Error al cargar: ${error.message}<br><br><button onclick="cargarYRenderizar()" class="mt-2 px-4 py-2 bg-primary text-white rounded-lg">Reintentar</button></td></tr>`;
                showToast('Error al cargar cotizaciones: ' + error.message, 'error');
            } finally {
                isLoading = false;
                if (refreshBtn) {
                    refreshBtn.classList.remove('btn-disabled');
                    refreshBtn.disabled = false;
                }
            }
        }

        function escapeHtml(str) { 
            if (!str) return '';
            return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
        }
        
        // Funciones globales para acciones
        window.editarCotizacion = function(idCotizacion, idPedido, idProducto) {
            window.location.href = `cotizacion_editar.html?id_cotizacion=${idCotizacion}&id_pedido=${idPedido}&id_producto=${idProducto}`;
        };
        
        window.eliminarCotizacion = async function(idCotizacion) {
            if (!idCotizacion) {
                showToast('ID de cotización inválido', 'error');
                return;
            }
            
            if (confirm(`¿Estás seguro de eliminar esta cotización?`)) {
                // Deshabilitar temporalmente el botón de eliminar
                const btns = document.querySelectorAll(`.btn-eliminar[data-id="${idCotizacion}"]`);
                btns.forEach(btn => {
                    btn.classList.add('btn-disabled');
                    btn.disabled = true;
                });
                
                try {
                    console.log(`Intentando eliminar cotización ID: ${idCotizacion}`);
                    const res = await fetch(`${API_BASE}/cotizacion/${idCotizacion}`, {
                        method: 'DELETE',
                        headers: getHeaders()
                    });
                    
                    console.log('Respuesta DELETE:', res.status, res.statusText);
                    
                    if (res.ok) {
                        showToast('Cotización eliminada correctamente', 'success');
                        // Recargar la tabla después de eliminar
                        setTimeout(() => {
                            cargarYRenderizar();
                        }, 500);
                    } else {
                        const errorText = await res.text();
                        console.error('Error respuesta:', errorText);
                        throw new Error(`Error ${res.status}: ${errorText || 'No se pudo eliminar'}`);
                    }
                } catch (error) {
                    console.error('Error en eliminación:', error);
                    showToast('Error al eliminar: ' + error.message, 'error');
                    // Reactivar botones en caso de error
                    btns.forEach(btn => {
                        btn.classList.remove('btn-disabled');
                        btn.disabled = false;
                    });
                }
            }
        };
        
        // Refresh button
        document.getElementById('btn-refresh')?.addEventListener('click', (e) => {
            e.preventDefault();
            if (!isLoading) {
                cargarYRenderizar();
            }
        });
        
        // Cargar datos al iniciar (una sola vez)
        cargarYRenderizar();
        
        // ELIMINADO: El setInterval que causaba recargas automáticas
        // Si quieres mantener actualizaciones automáticas, descomenta esto pero con mayor intervalo
        /*
        let refreshInterval = setInterval(() => {
            if (document.visibilityState === 'visible' && !isLoading) {
                cargarYRenderizar();
            }
        }, 60000); // Ahora cada 60 segundos en lugar de 30
        */
        
        // Limpiar intervalo al salir de la página (opcional)
        window.addEventListener('beforeunload', () => {
            if (window.refreshInterval) {
                clearInterval(window.refreshInterval);
            }
        });
    </script>
</body>
</html>
